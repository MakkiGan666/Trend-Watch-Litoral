services:
  db:
    image: postgis/postgis:17-3.5
    container_name: trendwatch_litoral_db
    restart: always
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: postgres  
      POSTGRES_PASSWORD: django_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db"]
      interval: 5s
      timeout: 5s
      retries: 5
  web:
    build: .
    env_file:
      - .env
    container_name: trendwatch_litoral_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    environment:
      DB_NAME: db
      DB_USER: postgres
      DB_PASSWORD: django_password
      DB_HOST: db
      DB_PORT: 5432
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  
