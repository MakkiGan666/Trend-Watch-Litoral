services:
  db:
    image: postgis/postgis:17-3.5
    container_name: trendwatch_litoral_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Definir DB_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Sólo accesible desde esta máquina (desarrollo local sin Docker).
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  web:
    build: .
    env_file:
      - .env
    container_name: trendwatch_litoral_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"
    # El resto de la configuración (SECRET_KEY, DB_*, GEMINI_API_KEY, ...) llega desde .env.
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  
