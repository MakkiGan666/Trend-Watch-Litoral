{% extends "base.html" %}

{% block title %}{{ titulo_formulario }} · TrendWatch{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 40px auto; padding: 20px; background: #fff; border-radius: 8px; color: #333;">
    <h2>{{ titulo_formulario }}</h2>

    <form method="post">
        {% csrf_token %}
        
        {{ form.as_p }}

        <div style="margin-top: 20px;">
            <button type="submit" style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
                {{ texto_boton }}
            </button>
            <a href="{% url 'dashboard' %}" style="margin-left: 10px; color: #666;">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
