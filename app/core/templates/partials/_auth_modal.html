<div class="login-modal" id="login-modal" role="dialog" aria-modal="true"
     aria-labelledby="login-modal-title" aria-describedby="login-modal-description"{% if not open_login_modal %} hidden{% endif %}>
  <div class="login-modal__backdrop" data-login-close></div>
  <section class="login-modal__panel glass glass--deep glass--sheen">
    <button class="login-modal__close icon-btn" type="button" aria-label="Cerrar autenticación" data-login-close>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    {% include "partials/_auth_form.html" with heading_id="login-modal-title" description_id="login-modal-description" %}
  </section>
</div>
