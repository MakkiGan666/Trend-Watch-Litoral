<div class="account-actions">
  <div class="account-notifications">
    <button class="btn btn--ghost account-bell" type="button" aria-label="Notificaciones" aria-expanded="false" aria-controls="account-notifications-panel" data-account-notifications>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 4 1.5 6 1.5 6h-15S6 13 6 9Z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>
    </button>
    <div class="account-notifications__panel glass glass--deep" id="account-notifications-panel" hidden>
      <strong>Notificaciones</strong>
      <p data-notification-status>Todavía no configuraste las notificaciones.</p>
      <p>El envío de avisos estará disponible próximamente.</p>
      <button class="btn btn--ghost notification-preferences-button" type="button" data-notification-configure>Configurar notificaciones</button>
    </div>
  </div>
  {% if request.user.is_authenticated %}
    <span class="nav__user">Hola, {{ request.user.get_username }}</span>
    <a class="btn btn--ghost account-enter" href="{% url 'logout' %}">Cerrar sesión</a>
  {% else %}
    <a class="btn btn--ghost account-enter" href="{% url 'landing' %}#login-modal" aria-haspopup="dialog">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="3.5"/><path d="M4 21v-2a8 8 0 0 1 16 0v2Z"/></svg>
      <span>Ingresar</span>
    </a>
  {% endif %}
</div>
