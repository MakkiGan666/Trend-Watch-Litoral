<div class="dashboard-calendar" id="{{ calendar_id }}" role="dialog" aria-modal="false" aria-label="Elegir fecha: {{ calendar_label|default:'publicación' }}" hidden>
    <div class="dashboard-calendar__head">
        <button type="button" class="icon-btn" data-calendar-prev aria-label="Mes anterior">‹</button>
        <strong id="{{ calendar_id }}-month" data-calendar-month aria-live="polite"></strong>
        <button type="button" class="icon-btn" data-calendar-next aria-label="Mes siguiente">›</button>
    </div>
    <div class="dashboard-calendar__jump">
        <select data-calendar-month-select aria-label="Elegir mes del calendario">
            <option value="0">Enero</option><option value="1">Febrero</option><option value="2">Marzo</option><option value="3">Abril</option>
            <option value="4">Mayo</option><option value="5">Junio</option><option value="6">Julio</option><option value="7">Agosto</option>
            <option value="8">Septiembre</option><option value="9">Octubre</option><option value="10">Noviembre</option><option value="11">Diciembre</option>
        </select>
        <input data-calendar-year-input type="number" min="{{ minimum_year|default:1 }}" max="9999" step="1" aria-label="Elegir año del calendario">
    </div>
    <div class="dashboard-calendar__week" aria-hidden="true"><span>Lu</span><span>Ma</span><span>Mi</span><span>Ju</span><span>Vi</span><span>Sá</span><span>Do</span></div>
    <div class="dashboard-calendar__days" data-calendar-days role="group" aria-labelledby="{{ calendar_id }}-month"></div>
    <div class="dashboard-calendar__foot"><button type="button" data-calendar-today>Hoy</button><button type="button" data-calendar-clear>Quitar fecha</button></div>
</div>
