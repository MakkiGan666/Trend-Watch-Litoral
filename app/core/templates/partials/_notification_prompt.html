<dialog class="notification-prompt glass glass--deep glass--sheen" id="notification-prompt" aria-labelledby="notification-title" aria-describedby="notification-description" data-notification-auto="{% if auto_prompt %}true{% else %}false{% endif %}">
  <button class="notification-prompt__close icon-btn" type="button" data-notification-close aria-label="Cerrar opciones de notificaciones">×</button>
  <h2 id="notification-title">¿Querés recibir notificaciones?</h2>
  <p id="notification-description">El servicio de avisos estará disponible próximamente. Podés dejar preparado el permiso para recibir novedades de la región.</p>
  <p class="notification-prompt__status" data-notification-result role="status" aria-live="polite"></p>
  <div class="notification-prompt__actions" data-notification-choices>
    <button class="btn btn--ghost" type="button" data-notification-no>No</button>
    <button class="btn btn--primary" type="button" data-notification-yes>Sí</button>
  </div>
  <button class="btn btn--ghost notification-prompt__done" type="button" data-notification-done hidden>Cerrar</button>
  <p class="notification-prompt__note">Podés volver a configurar tu elección desde la campana.</p>
</dialog>
